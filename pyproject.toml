[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-assistant"
version = "0.1.0"
description = "Local personal cognitive assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-assistant = "local_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
